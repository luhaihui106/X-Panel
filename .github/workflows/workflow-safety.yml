name: Workflow safety
on:
  push:
    branches: [main, 'ci/**', 'feat/**', 'integration/**']
  pull_request:
permissions:
  contents: read
jobs:
  workflow-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: python tests/workflow_safety.py
